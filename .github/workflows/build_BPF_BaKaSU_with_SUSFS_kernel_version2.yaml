name: Build 5.10-BPF BakaSU Kernel with SUSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '27 10 * * 4'
    
env:
  # Device env
  DEVICE_NAME : "realme_q3s_cn"
  DEVICE_CODENAME : "ice"

  CUSTOM_CMDS : "CROSS_COMPILE=aarch64-linux-gnu- NM=llvm-nm OBJDUMP=llvm-objdump STRIP=llvm-strip"
  EXTRA_CMDS : ""

  KERNEL_SOURCE : "https://github.com/zhzhzhzh114514/android_kernel_oppo_sm7325.git"
  KERNEL_BRANCH : "5.10-bpf"

  CLANG_SOURCE : "https://github.com/ZYouXPro/android_kernel_oppo_sm7325/releases/download/K11/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "shit_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true" # if u want easy setting kernelsu, u can true.
  KERNELSU_AUTO_FORK : "bakasu" # xxksu, rsuntk , next, bakasu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  AK3_SOURCE : "https://github.com/zhzhzhzh114514/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "coloros17.0_a17"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # AnyKernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into AnyKernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "zhzhzhzh114514/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "op_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "tropspk_oos" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "true" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method -> syscall.

  KPM_ENABLE: "false" # Anyone devices.
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "true" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only AnyKernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "false" # Merge config files.
  MERGE_CONFIG_FILES: "vendor/debugfs.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.
  
jobs:
  build:
    name: Compile Kernel
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Configure Fast APT Mirror
        uses: vegardit/fast-apt-mirror.sh@v1

      - name: Make Build Environment
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y kmod cpio binutils cmake binutils-aarch64-linux-gnu git wget pahole automake flex lzop bison gperf build-essential zip curl zlib1g-dev libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip dwarves device-tree-compiler python3 ccache git-lfs gnupg imagemagick libelf-dev libncurses5-dev libsdl1.2-dev gpart fuse2fs e2fsck-static icu-doc rsync adb fastboot libstdc++6 python-is-python3 gcc-aarch64-linux-gnu 
          mkdir -p device_kernel

      - name: Checkout Kernel Source
        uses: actions/checkout@v6
        with:
          repository: ZYouXPro/android_kernel_oppo_sm7325
          path: device_kernel
          fetch-depth: 1
          ref: 5.10-bpf

      - name: Checkout Modules Source
        uses: actions/checkout@v6
        with:
          repository: oppo-source/android_kernel_modules_and_devicetree_oppo_sm7325
          path: temp_modules
          ref: oppo/sm7325_v_15.0.0_k11
          
      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          # Only ${{ env.DEVICE_NAME }} use it.
          cd $GITHUB_WORKSPACE/device_kernel

          # Nothing

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: Prepare Compiler
        run: |
          mkdir -p compiler
          cd compiler
          curl -fL "https://github.com/ZYouXPro/android_kernel_oppo_sm7325/releases/download/K11/linux-x86-refs_heads_llvm-r383902b-clang-r383902.tar.gz" -o clang-r383902.tar.gz --connect-timeout 30 --retry 5 --retry-delay 5
          mkdir -p clang-bin
          tar -xzf clang-r383902.tar.gz -C clang-bin
          rm clang-r383902.tar.gz

      - name: Handle Dependencies
        run: |
          mv temp_modules/vendor ./vendor
          mv temp_modules/device ./device
          rm -rf temp_modules

      - name: Set Release Info & Custom Version
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          export PATH="$(pwd)/compiler/clang-bin/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="arm-linux-androideabi-"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CLANG_PATH="$(pwd)/compiler/clang-bin/bin"
          export ARCH="arm64"
          export SUBARCH="arm64"
          cd device_kernel/
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash
          curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/mainline/Patches/syscall_hook_patches.sh" -o syscall_hook_patches.sh
          chmod +x syscall_hook_patches.sh
          bash syscall_hook_patches.sh
          
          # Fuck -dirty
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          echo "KernelSU/" >> .git/info/exclude
          echo "/drivers/kernelsu" >> .git/info/exclude
          git add -A
          git commit -m "apply patches" --no-verify
          
          make O=out CC="clang" LLVM=1 shit_defconfig
          ./scripts/config --file out/.config \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_HOOK
          make O=out CC="clang" LLVM=1 -j$(nproc)

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/ZYouXPro/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git
          cp device_kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../BPF-BakaSU-Kernel-${{ env.BUILD_DATE }}.zip . \
            -x ".git*" "README.md" "*placeholder"

      - name: Pack Boot Image
        run: |
          pwd
          mkdir -p boot_pack
          cd boot_pack
          wget https://github.com/ZYouXPro/android_kernel_oppo_sm7325/releases/download/K11/magiskboot
          chmod +x magiskboot
          curl -fL "https://github.com/ZYouXPro/android_kernel_oppo_sm7325/releases/download/K11/boot.img" -o boot_origin.img
          ./magiskboot unpack boot_origin.img
          if [ ! -f "../device_kernel/out/arch/arm64/boot/Image" ]; then
            echo "错误：编译出的 Image 文件不存在，请检查编译步骤！"
            exit 1
          fi
          cp ../device_kernel/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_origin.img ../boot-BPF-BakaSU-${{ env.BUILD_DATE }}.img
          pwd
          cd ..
          pwd

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: BakaSU_kernel
          path: |
            BPF-BakaSU-Kernel-${{ env.BUILD_DATE }}.zip
            boot-BPF-BakaSU-${{ env.BUILD_DATE }}.img

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BUILD_DATE }}
          name: KernelSU Kernel for OPLUS SM7325 (${{ env.BUILD_DATE }})
          body: |
            ⌛编译日期: ${{ env.BUILD_DATE }}
            🍼内核版本: 5.4.254
            🍨欢迎刷入ZYOUX的内核！
            🧀ZIP为AnyKernel3可用KSU管理器直接更新哦！
            🥞ColorOS 17及以上版本需要使用BPF版本才能开机！
          files: |
            BPF-BakaSU-Kernel-${{ env.BUILD_DATE }}.zip
            boot-BPF-BakaSU-${{ env.BUILD_DATE }}.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

